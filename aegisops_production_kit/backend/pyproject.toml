[project]
name = "aegisops-backend"
version = "0.1.0"
description = "AegisOps — agentic AIOps platform (FastAPI + LangGraph)"
requires-python = ">=3.11"
dependencies = [
  # ── Web / API ──
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.35",
  "gunicorn>=23.0",
  "sse-starlette>=2.1,<3",
  "python-multipart>=0.0.12",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2",
  "httpx>=0.27,<0.29",
  "tenacity>=9.0",
  "structlog>=24.4",
  "slowapi>=0.1.9",

  # ── Data ──
  "sqlalchemy>=2.0.35,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3.5",
  "redis>=5.1,<6",
  "neo4j>=5.25,<6",

  # ── Agents / LLM ──
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0.1",
  "langchain-core>=0.3.15",
  "google-genai>=0.3.0",

  # ── Auth ──
  "python-keycloak>=4.5",
  "authlib>=1.3",
  "pyjwt[crypto]>=2.9",

  # ── Observability ──
  "langfuse>=2.53,<3",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-logging>=0.49b0",
  "prometheus-client>=0.21",

  # ── Cloud SDKs (read-only discovery / verify) ──
  "boto3>=1.35",
  "azure-identity>=1.19",
  "azure-mgmt-resource>=23.1",
  "azure-mgmt-compute>=33.0",
  "azure-mgmt-network>=27.0",
  "google-cloud-resource-manager>=1.13",
  "google-cloud-compute>=1.19",
  "pyvmomi>=8.0.3",
  "kubernetes>=31.0",

  # ── DevOps / ITSM ──
  "PyGithub>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "testcontainers>=4.8",
  "ruff>=0.7",
  "mypy>=1.13",
  "anyio>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
