# AegisOps scanner waivers - every skip is documented here AND in the
# PROGRESS.md scanner ledger. New checks fail the scan until triaged.
# REMOVED when the enhancement shipped: the world-open-authorized-networks and
# backups checks now pass on module defaults (secure-by-default; the platform schema
# keeps old behavior for existing resources).
# The PostgreSQL flag family below is a SCANNER LIMITATION, not a missing capability:
# the flags ship via var.database_flags (module default = the full 10-flag observability
# set) rendered through a dynamic block, which checkov cannot expand inside settings.
# The workspace's committed terraform test asserts all 10 flags render - regression-proof.
skip-check:
  - CKV_GCP_51    # log_checkpoints ships in the module-default flag set; dynamic-block scanner limitation (tfsec sees it and passes)
  - CKV_GCP_52    # log_connections: same
  - CKV_GCP_53    # log_disconnections: same
  - CKV_GCP_54    # log_lock_waits: same
  - CKV_GCP_108   # log_hostname: same
  - CKV_GCP_109   # log_min_messages=error: same
  - CKV_GCP_110   # cloudsql.enable_pgaudit: same
  - CKV_GCP_111   # log_statement=ddl: same
  - CKV2_GCP_13   # log_duration: same
  - CKV_GCP_6     # google provider 5.x replaced require_ssl with ssl_mode (module default ENCRYPTED_ONLY); the check tracks the removed attribute
  - CKV_GCP_60    # public IP is the sandbox access path; the private_network option ships and drops it entirely
  - CKV_GCP_79    # major-version bump is destructive for existing instances; version is variable-driven
