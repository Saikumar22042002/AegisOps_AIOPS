# AegisOps scanner waivers - documented in the PROGRESS.md scanner ledger.
# tfsec v1.28 config excludes match legacy IDs; the AVD id is in each comment.
# REMOVED when the enhancement shipped (tfsec evaluates the module's secure defaults):
# the pg flag family (temp-file/connections/disconnections/lock-waits/checkpoints),
# backups, and the world-open authorized-network finding.
exclude:
  - google-sql-encrypt-in-transit-data  # AVD-GCP-0015 | google provider 5.x replaced require_ssl with ssl_mode (module default ENCRYPTED_ONLY); the check tracks the removed attribute
  - google-sql-no-public-access  # AVD-GCP-0017 | public IP is the sandbox access path; the private_network option ships and drops it entirely
