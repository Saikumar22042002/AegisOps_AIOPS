  - CKV2_AZURE_45   # mssql private endpoint: same as above
  - CKV2_AZURE_34   # mssql firewall 0.0.0.0-0.0.0.0 is the allow-azure-services sentinel, not world-open
  - CKV2_AZURE_27   # mssql AAD auth needs a caller-supplied AAD admin identity; opt-in candidate
  - CKV_AZURE_23    # mssql auditing needs a log storage-account dependency; opt-in candidate, never forced
  - CKV_AZURE_24    # mssql audit retention: same storage dependency as above
  - CKV2_AZURE_2    # mssql vulnerability assessment needs storage + Defender plan; enterprise opt-in
  - CKV_AZURE_224   # SQL Ledger: niche compliance feature; not part of the module contract
