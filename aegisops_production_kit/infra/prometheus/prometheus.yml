global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: aegisops

# PR-6: operator alert rules. Each rule carries a runbook annotation; Alertmanager wiring
# is documented in docs/RESTORE_RUNBOOK.md. Lint: promtool check rules alerts.yml
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # AegisOps API /metrics. Covers both the host-run API (`make dev`) and the
  # containerized API (`--profile full`). Unreachable targets are simply marked down.
  - job_name: aegisops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { deployment: host }
      - targets: ["api:8000"]
        labels: { deployment: compose }

  # Metrics the OTel Collector re-exports (app metrics forwarded via OTLP).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
