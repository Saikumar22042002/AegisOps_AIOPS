name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo "compose OK"

  terraform-scan:
    name: Terraform security scan (checkov + tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners (pinned to the versions baked into the API image)
        run: |
          pip install "checkov==3.3.8"
          sudo curl -fsSL "https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64" -o /usr/local/bin/tfsec
          sudo chmod +x /usr/local/bin/tfsec
          checkov --version && tfsec --version
      - name: Scan all workspaces (waivers per-workspace, ledger in PROGRESS.md)
        run: bash infra/scan-workspaces.sh

  supply-chain:
    name: Supply-chain audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PR-7: pip-audit — report always; FAIL only on CRITICAL (baseline triage in
      # PROGRESS.md → 'Supply-chain baseline'). --strict off first, criticals block.
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          pip install --upgrade pip pip-audit
          pip install -e . 2>/dev/null || true
          echo "== full advisory report (non-blocking):"
          pip-audit --desc || true
          echo "== blocking gate: CRITICAL only"
          pip-audit --vulnerability-service osv --format json > pip-audit.json || true
          python - <<'PY'
          import json, sys
          try:
              data = json.load(open("pip-audit.json"))
          except Exception:
              sys.exit(0)
          deps = data.get("dependencies", data) if isinstance(data, dict) else data
          crit = []
          for d in (deps or []):
              for v in (d.get("vulns") or d.get("vulnerabilities") or []):
                  sev = (v.get("severity") or "").upper() if isinstance(v, dict) else ""
                  if "CRITICAL" in str(v).upper() or sev == "CRITICAL":
                      crit.append((d.get("name"), v.get("id")))
          if crit:
              print("BLOCKING — critical advisories:", crit); sys.exit(1)
          print("no critical advisories")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm install --package-lock-only 2>/dev/null || true
          echo "== full report (non-blocking):"
          npm audit || true
          echo "== blocking gate: high+ severity"
          npm audit --audit-level=high
