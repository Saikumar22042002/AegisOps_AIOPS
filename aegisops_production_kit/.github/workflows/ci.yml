name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # P0: behavioral evaluation gate (Redesign/04 §9, 07 item 0.2). Two steps prove two
  # properties: (1) the current behavior passes; (2) the gate CAN reject known-bad
  # behavior — the seeded known-bad fixture must FAIL scoring or the self-test closes
  # the gate. A red gate blocks the release like any other required job.
  evals:
    name: Behavioral evaluation gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Gate (deterministic lane — recorded fixtures through real code)
        run: python -m evals.gate
      - name: Gate self-test (known-bad fixture MUST be rejected)
        run: python -m evals.gate --self-test
      - name: Upload verdict artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/evals/out/
          if-no-files-found: warn

  # P0 security/preflight: secret + Terraform-state/plan + .env leak scanning over the
  # committed tree. Policy + the operator-declared sandbox allowlist live in
  # .gitleaks.toml — findings outside that exact-path manifest fail the job. Output is
  # redacted (never prints secret values).
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed tree
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  frontend:
    name: Frontend (lint + typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo "compose OK"

  terraform-scan:
    name: Terraform security scan (checkov + tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners (pinned to the versions baked into the API image)
        run: |
          pip install "checkov==3.3.8"
          sudo curl -fsSL "https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64" -o /usr/local/bin/tfsec
          sudo chmod +x /usr/local/bin/tfsec
          checkov --version && tfsec --version
      - name: Scan all workspaces (waivers per-workspace, ledger in PROGRESS.md)
        run: bash infra/scan-workspaces.sh

  supply-chain:
    name: Supply-chain audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PR-7: pip-audit — report always; FAIL only on CRITICAL (baseline triage in
      # PROGRESS.md → 'Supply-chain baseline'). --strict off first, criticals block.
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          pip install --upgrade pip pip-audit
          pip install -e . 2>/dev/null || true
          echo "== full advisory report (non-blocking):"
          pip-audit --desc || true
          echo "== blocking gate: CRITICAL only"
          pip-audit --vulnerability-service osv --format json > pip-audit.json || true
          python - <<'PY'
          import json, sys
          try:
              data = json.load(open("pip-audit.json"))
          except Exception:
              sys.exit(0)
          deps = data.get("dependencies", data) if isinstance(data, dict) else data
          crit = []
          for d in (deps or []):
              for v in (d.get("vulns") or d.get("vulnerabilities") or []):
                  sev = (v.get("severity") or "").upper() if isinstance(v, dict) else ""
                  if "CRITICAL" in str(v).upper() or sev == "CRITICAL":
                      crit.append((d.get("name"), v.get("id")))
          if crit:
              print("BLOCKING — critical advisories:", crit); sys.exit(1)
          print("no critical advisories")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm install --package-lock-only 2>/dev/null || true
          echo "== full report (non-blocking):"
          npm audit || true
          echo "== blocking gate: high+ severity"
          npm audit --audit-level=high
