# ── Dev override (auto-loaded by `docker compose`) ────────────────────────────
# Runs the API from MOUNTED host source instead of the baked image layer, so code
# changes take effect on a container restart without an image rebuild. This exists
# because image rebuilds on this host (OneDrive path + Docker Desktop) intermittently
# fail to invalidate the COPY cache, leaving stale code in the image.
#
# To return to the pure baked-image production model, delete this file (or run with
# only the base file:  docker compose -f docker-compose.yml --profile full up -d).
services:
  api:
    environment:
      # Phase-2 exit-gate posture (B1/B3): worker-agnostic streaming over Redis Streams and the
      # stranded-run reconciler on. This is the multi-worker production posture; the in-memory
      # bus remains the single-worker default in settings.
      AEGISOPS_EVENT_BUS: redis
      AEGISOPS_RECONCILER: "on"
    volumes:
      - "./backend/app:/app/app"
      # GCP service-account key for the Terraform google provider (gitignored host dir).
      - "./infra/secrets:/secrets:ro"

  # ── Second API worker (Phase-2 exit gate: multi-worker streaming demo) ────────
  # Same image + mounted source as `api`, on port 8001. A run started on `api` streams and
  # reconnects from `api-b` because events live in Redis Streams, sessions in the server-side
  # store, and state in PG — the API itself is stateless (B1).
  api-b:
    image: aegisops-api:local
    restart: unless-stopped
    profiles: ["full"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegisops}:${POSTGRES_PASSWORD:-aegisops}@postgres:5432/${POSTGRES_DB:-aegisops}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      LANGFUSE_HOST: http://langfuse:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      TF_PLUGIN_CACHE_DIR: /app/.tf-plugin-cache
      AEGISOPS_EVENT_BUS: redis
      AEGISOPS_RECONCILER: "on"
    ports: ["8001:8000"]
    volumes:
      - "./backend/app:/app/app"
      - "./infra/secrets:/secrets:ro"
      - "${KUBECONFIG_HOST:-./infra/kube/empty-kubeconfig}:/root/.kube/config:ro"
      - "tfstate:/app/.terraform-state"
      - "tfplugins:/app/.tf-plugin-cache"
      - "./infra/terraform-workspaces:/app/infra/terraform-workspaces"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  # ── Test runner (profile `test`, never auto-starts) ───────────────────────────
  # The prod API image is intentionally slim (`pip install .` — no dev extras), so it
  # has no pytest. This service reuses that already-built image, adds ONLY the test
  # tools at runtime, and runs the suite against the LIVE compose datastores (reachable
  # by service name) — the same real PG/Redis/Neo4j the app uses. Host source is mounted
  # over the baked copy (PYTHONPATH=/app) so tests always run against current code, and
  # runs as root so pip can install into the image's site-packages. Invoke via:
  #   docker compose --profile test run --rm api-test              # full suite
  #   docker compose --profile test run --rm api-test pytest -q -k routing
  api-test:
    image: aegisops-api:local
    profiles: ["test"]
    user: root
    working_dir: /app
    env_file: [.env]
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegisops}:${POSTGRES_PASSWORD:-aegisops}@postgres:5432/${POSTGRES_DB:-aegisops}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      KEYCLOAK_URL: http://keycloak:8080
      LANGFUSE_HOST: http://langfuse:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_URL: http://prometheus:9090
      # Integration tests use these running datastores directly (no testcontainers/DinD).
      AEGISOPS_TEST_LIVE_DATASTORES: "1"
      # B3: no periodic reconciler loop auto-starts in the test TestClient lifespan — tests that
      # exercise the reconciler call sweep() explicitly on their own Reconciler instance.
      AEGISOPS_RECONCILER: "off"
    volumes:
      - "./backend:/app"
      - "./infra/secrets:/secrets:ro"
      - "./infra/terraform-workspaces:/app/infra/terraform-workspaces"
      # Single source of truth for the stale-waiver guard test: a scanner waiver may not
      # reference an MS item that FIX.md §8 marks done.
      - "../FIX.md:/app/FIX.md:ro"
      # PR-1c: the hygiene posture test reads the real ignore rules.
      - "./.gitignore:/app/.gitignore:ro"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    command:
      - "sh"
      - "-lc"
      # The trailing chmod keeps the mounted terraform workspaces writable by the API
      # container's non-root user — this test service runs as root, and root-created
      # terraform.tfstate.d/ dirs would otherwise block the app's per-resource state
      # workspaces (found live in Phase 8). Exit code of pytest is preserved.
      - "pip install -q pytest pytest-asyncio pytest-cov testcontainers anyio && pytest -q; rc=$?; chmod -R a+rwX /app/infra/terraform-workspaces 2>/dev/null || true; exit $rc"
