# ── Local-production override (auto-loaded by `docker compose`) ───────────────
# CLN-1 (2026-07-14): the dev host-source mounts over the baked image are REMOVED —
# api and api-b now run the code baked into aegisops-api:local (pure baked-image
# posture; rebuild with `docker compose --profile full build` after code changes).
# What remains here is runtime configuration, not code:
#   * the Phase-2 exit-gate multi-worker posture (Redis Streams bus + reconciler),
#   * the gitignored runtime-credential mount (/secrets, GCP SA key),
#   * the second API worker (api-b) proving the stateless multi-worker model,
#   * the profile-gated test runner (api-test), which mounts host source BY DESIGN
#     so tests always execute the current checkout against the live datastores.
services:
  api:
    environment:
      # Phase-2 exit-gate posture (B1/B3): worker-agnostic streaming over Redis Streams and the
      # stranded-run reconciler on. This is the multi-worker production posture; the in-memory
      # bus remains the single-worker default in settings.
      AEGISOPS_EVENT_BUS: redis
      AEGISOPS_RECONCILER: "on"
      # P0 worker foundation (F-18): `api` owns the background sweeps; `api-b` is
      # role=api below — exactly ONE reconciler/retention/drift owner per deployment.
      AEGISOPS_ROLE: all
    volumes:
      # GCP service-account key for the Terraform google provider (gitignored host dir).
      - "./infra/secrets:/secrets:ro"

  # ── Second API worker (Phase-2 exit gate: multi-worker streaming demo) ────────
  # Same baked image as `api`, on port 8001. A run started on `api` streams and
  # reconnects from `api-b` because events live in Redis Streams, sessions in the server-side
  # store, and state in PG — the API itself is stateless (B1).
  api-b:
    image: aegisops-api:local
    restart: unless-stopped
    profiles: ["full"]
    env_file: [.env]
    environment:
      # POSTGRES_PORT pinned to the container-internal 5432 — .env carries the
      # host-published port and would otherwise leak in via env_file.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegisops}:${POSTGRES_PASSWORD:-aegisops}@postgres:5432/${POSTGRES_DB:-aegisops}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      LANGFUSE_HOST: http://langfuse:3000
      # STAB P2-1: browser-facing origin for trace deep-links.
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3001}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      TF_PLUGIN_CACHE_DIR: /app/.tf-plugin-cache
      # STAB P0-1: same native-volume .terraform relocation as the api service.
      TF_DATA_ROOT: /app/.terraform-state/tfdata
      AEGISOPS_EVENT_BUS: redis
      AEGISOPS_RECONCILER: "on"
      # P0 worker foundation (F-18): serve HTTP/SSE only — no duplicate sweeps.
      AEGISOPS_ROLE: api
    ports: ["8001:8000"]
    volumes:
      - "./infra/secrets:/secrets:ro"
      - "${KUBECONFIG_HOST:-./infra/kube/empty-kubeconfig}:/root/.kube/config:ro"
      - "tfstate:/app/.terraform-state"
      - "tfplugins:/app/.tf-plugin-cache"
      - "./infra/terraform-workspaces:/app/infra/terraform-workspaces"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  # ── Test runner (profile `test`, never auto-starts) ───────────────────────────
  # The prod API image is intentionally slim (`pip install .` — no dev extras), so it
  # has no pytest. This service reuses that already-built image, adds ONLY the test
  # tools at runtime, and runs the suite against the LIVE compose datastores (reachable
  # by service name) — the same real PG/Redis/Neo4j the app uses. Host source is mounted
  # over the baked copy (PYTHONPATH=/app) so tests always run against current code, and
  # runs as root so pip can install into the image's site-packages. Invoke via:
  #   docker compose --profile test run --rm api-test              # full suite
  #   docker compose --profile test run --rm api-test pytest -q -k routing
  api-test:
    image: aegisops-api:local
    profiles: ["test"]
    user: root
    working_dir: /app
    env_file: [.env]
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      # POSTGRES_PORT pinned to the container-internal 5432 (see api-b above).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegisops}:${POSTGRES_PASSWORD:-aegisops}@postgres:5432/${POSTGRES_DB:-aegisops}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      KEYCLOAK_URL: http://keycloak:8080
      LANGFUSE_HOST: http://langfuse:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_URL: http://prometheus:9090
      # Integration tests use these running datastores directly (no testcontainers/DinD).
      AEGISOPS_TEST_LIVE_DATASTORES: "1"
      # B3: no periodic reconciler loop auto-starts in the test TestClient lifespan — tests that
      # exercise the reconciler call sweep() explicitly on their own Reconciler instance.
      AEGISOPS_RECONCILER: "off"
      # A persistent provider cache so MODSEED tests' real `terraform init` doesn't
      # re-download providers (~700MB) every fresh container (the 2026-07-13 wedge) —
      # but its OWN volume, never the api's: this service runs as root, and root-written
      # provider files in the api's cache broke every live GCS plan with
      # "LICENSE.txt: permission denied" (STAB P0-1, regression from 1d27bd4).
      TF_PLUGIN_CACHE_DIR: /app/.tf-plugin-cache
    volumes:
      - "./backend:/app"
      # STAB P0-1: root-owned cache, separate from the api's `tfplugins` by construction.
      - "tfplugins-test:/app/.tf-plugin-cache"
      - "./infra/secrets:/secrets:ro"
      - "./infra/terraform-workspaces:/app/infra/terraform-workspaces"
      # Single source of truth for the stale-waiver guard test: a scanner waiver may not
      # reference an MS item that FIX.md §8 marks done.
      - "../FIX.md:/app/FIX.md:ro"
      # STAB P0-1 guard: the compose-invariant test reads the real service/volume wiring —
      # a root-running service must never mount the api's plugin-cache volume again.
      # Mounted under /compose, NOT /app: /app is the ./backend bind mount, so a /app target
      # would materialize 0-byte stubs at backend/docker-compose*.yml on the host.
      - "./docker-compose.yml:/compose/docker-compose.yml:ro"
      - "./docker-compose.override.yml:/compose/docker-compose.override.yml:ro"
      # PR-1c: the hygiene posture test reads the real ignore rules.
      - "./.gitignore:/app/.gitignore:ro"
      # P0: the security-preflight test reads the sandbox-classification manifest.
      - "./.gitleaks.toml:/app/.gitleaks.toml:ro"
      # PR-5/6/7: structural tests read these repo artifacts (mounted under /app so the
      # backend-dir anchor resolves them the same way it does on the host).
      - "./docs:/app/docs:ro"
      - "./infra/prometheus:/app/infra/prometheus:ro"
      - "./infra/backup:/app/infra/backup:ro"
      - "./.github:/app/.github:ro"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    command:
      - "sh"
      - "-lc"
      # The trailing chmod keeps the mounted terraform workspaces writable by the API
      # container's non-root user — this test service runs as root, and root-created
      # terraform.tfstate.d/ dirs would otherwise block the app's per-resource state
      # workspaces (found live in Phase 8). Exit code of pytest is preserved.
      - "pip install -q pytest pytest-asyncio pytest-cov testcontainers anyio && pytest -q; rc=$?; chmod -R a+rwX /app/infra/terraform-workspaces 2>/dev/null || true; exit $rc"

volumes:
  # STAB P0-1: api-test's own root-owned provider cache — persists across test runs
  # (keeps the 1d27bd4 no-re-download intent) without ever touching the api's cache.
  tfplugins-test:
